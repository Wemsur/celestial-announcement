name: 核对 Celestial 公告

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      sync_wemgit:
        description: 同步到 wemgit（维护期间可取消）
        type: boolean
        default: true
        required: false

permissions:
  contents: write
  issues: read

jobs:
  reconcile:
    uses: ./.github/workflows/publish-announcements.yml
    with:
      sync_wemgit: ${{ toJSON(inputs.sync_wemgit) != 'false' }}
    secrets: inherit
